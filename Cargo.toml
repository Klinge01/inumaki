[workspace]
resolver = "3"
members = ["crates/inumaki-core", "crates/inumaki-cli", "crates/inumaki-models", "crates/inumaki-eval", "crates/inumaki-vault", "crates/inumakid", "crates/inumaki-gateway", "crates/inumaki-mcp", "crates/inumaki-client", "crates/inumaki-adapters", "crates/inumaki-hook", "crates/inumaki-mail", "crates/inumaki-proxy", "crates/inumaki-mirror"]
exclude = ["apps/inumaki-app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
regex = "1"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "hybrid"] }
aho-corasick = "1"
rayon = "1"
getrandom = "0.3"
zeroize = "1"
dashmap = "6"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
tracing = "0.1"
proptest = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
ort = "=2.0.0-rc.13"
ndarray = "0.17"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
ureq = "3"
sha2 = "0.10"
dirs = "6"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
chacha20poly1305 = "0.10"
hmac = "0.12"
keyring = { version = "3", default-features = false, features = ["apple-native", "sync-secret-service", "crypto-rust", "vendored"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "process"] }
axum = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
subtle = "2"
base64 = "0.22"
# Exact: the gateway relies on rmcp 3.4.1 behaviour on the 2026-07-28 path
# (see handler.rs `cache_hints` and `listen`); re-run gateway_lifecycle on a bump.
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "client", "macros", "transport-streamable-http-server", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider", "transport-streamable-http-client-unix-socket", "transport-child-process", "transport-io"] }
tokio-util = "0.7"
futures = "0.3"
bytes = "1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rpassword = "7"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = { version = "0.11", features = ["full_encoding"] }
mail-builder = "1"
html2text = "0.17"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
flate2 = "1"
libc = "0.2"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = { version = "0.7", default-features = false }
rustix = { version = "1.1", features = ["fs"] }
csv = "1.4"
encoding_rs = "0.8"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
