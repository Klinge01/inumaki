# Name shapes the harness-static precision rules must never drop (plan
# 2026-10-12, review 1 C1-C3, integrator ruling L68). Tuning cases, so the
# tuning baselines' gated leak counts and the safety suite cover them.
# Shapes no detector finds today (/home/huber/, C:\Users\mhuber\,
# https://…/team/gruber) are not here: they leak before any rule, would fail
# the safety suite's zero-residue target, and a precision rule cannot touch
# an undetected span (ruling R12; integrator L71: a known recall gap, the
# next plan "path and URL name recall"). The same holds for a bare vocabulary-word
# surname in a CSV row (`Nachname;Vorname;Ort` / `Branch;Anna;Graz`): `Branch`
# is not detected today (recall gap, ruling R12), so that case is not here.

[[case]]
id = "shape-file-surname"
lang = "de"
why = "A surname inside a file name (C1)."
text = "Im Anhang finden Sie Rechnung_Huber_2026.pdf mit allen Positionen."
spans = [ { text = "Huber", kind = "PERSON" } ]

[[case]]
id = "shape-file-surname-hyphen"
lang = "de"
why = "A surname inside a hyphenated file name (N2). Blocked before any rule in the planner's scan; its target comes from Task 1."
text = "Im Anhang finden Sie Rechnung-Huber-2026.pdf mit allen Positionen."
spans = [ { text = "Huber", kind = "PERSON" } ]

