[[case]]
id = "address-without-number"
lang = "de"
why = "Address described without house number (concept doc §36)."
text = "Ich wohne gegenüber der Kirche in der Hauptstraße in Mödling."
spans = [
  { text = "Hauptstraße", kind = "STREET_ADDRESS" },
  { text = "Mödling", kind = "CITY" },
]

[[case]]
id = "address-wrapped"
lang = "de"
why = "Name and address broken across lines by mail clients."
text = """Bitte liefern Sie an Sarah
Leitner, Neubaugasse
22, 1070 Wien."""
spans = [
  { text = "Sarah\nLeitner", kind = "PERSON" },
  { text = "Neubaugasse\n22", kind = "STREET_ADDRESS" },
  { text = "1070", kind = "POSTAL_CODE" },
  { text = "Wien", kind = "CITY" },
]

[[case]]
id = "public-figure"
lang = "de"
why = "Public figures are identifiable by name alone."
text = "Wie Alexander Van der Bellen gestern sagte, ist das wichtig."
spans = [ { text = "Alexander Van der Bellen", kind = "PERSON" } ]

[[case]]
id = "rare-combination"
lang = "de"
why = "Profession, small employer and small town together identify one person."
text = "Ich bin der einzige Elektriker bei der Muster GmbH in Mank."
spans = [
  { text = "Muster GmbH", kind = "ORGANIZATION" },
  { text = "Mank", kind = "CITY" },
]

