id = "name-rose-hunter"
lang = "en"
why = "Both name parts are ordinary English words."
text = "Please forward this to Rose Hunter in accounting."
spans = [ { text = "Rose Hunter", kind = "PERSON" } ]

[[case]]
id = "word-may-negative"
