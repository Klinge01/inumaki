[[case]]
id = "name-reversed"
lang = "de"
why = "Surname-first order defeats the dictionary matcher (M1 carry-over, needs NER)."
text = "Kontakt: Leitner, Sarah (Buchhaltung), Durchwahl 22."
spans = [ { text = "Leitner, Sarah", kind = "PERSON" } ]

[[case]]
id = "name-inflected"
lang = "de"
why = "Genitive form of a surname alone (M1 carry-over, needs NER or morphology)."
text = "Frau Leitners Rechnung ist noch offen."
spans = [ { text = "Leitners", kind = "PERSON" } ]
