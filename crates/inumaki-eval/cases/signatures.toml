[[case]]
id = "sig-de-full"
lang = "de"
why = "Signature blocks are dense with identifiers."
text = """Vielen Dank!

Mit freundlichen Grüßen
Sarah Leitner
Geschäftsführerin
Leitner & Partner GmbH
Neubaugasse 22, 1070 Wien
Tel. +43 660 1234567
sarah.leitner@leitner-partner.at"""
spans = [
  { text = "Sarah Leitner", kind = "PERSON", occurrence = 1 },
  { text = "Leitner & Partner GmbH", kind = "ORGANIZATION" },
  { text = "Neubaugasse 22", kind = "STREET_ADDRESS" },
  { text = "1070", kind = "POSTAL_CODE" },
  { text = "Wien", kind = "CITY" },
  { text = "+43 660 1234567", kind = "PHONE" },
  { text = "sarah.leitner@leitner-partner.at", kind = "EMAIL" },
]

