# Names and identifiers in structured positions (plan 2026-10-20, ruling
# L121; see docs/quality/2026-10-20-structured-positions.md
# §7.1). Tuning cases, registered in src/cases.rs since Task 7 (ruling S21).
# harness/name-shapes.jsonl carries these ids too (the `shape-` prefix);
# harness/structured-positions.jsonl is the stand-alone dump, rebuilt with
# scripts/harness-corpus/cases-to-jsonl.py whenever this file changes.
# The shape-fname-* texts are bare file-name stems, as the folder mirror
# scans them.

[[case]]
id = "shape-fname-surname-capital"
lang = "de"
why = "B6: a capitalized surname in a file-name stem, as the mirror scans it."
text = "Rechnung_Huber_2026"
spans = [ { text = "Huber", kind = "PERSON" } ]

