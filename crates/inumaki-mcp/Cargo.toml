[package]
name = "inumaki-mcp"
description = "stdio MCP shim that relays to a local inumakid dataset over the control socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "inumaki-mcp"
path = "src/main.rs"

[dependencies]
rmcp.workspace = true
tokio.workspace = true
clap.workspace = true
inumaki-client = { path = "../inumaki-client" }

[dev-dependencies]
inumakid = { path = "../inumakid" }
inumaki-gateway = { path = "../inumaki-gateway", features = ["test-fixtures"] }
tempfile.workspace = true
serde_json.workspace = true
hyper.workspace = true

[lints]
workspace = true
