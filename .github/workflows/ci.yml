name: ci
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: >
          cargo run --release -q -p inumaki-cli -- eval --profile offline
          --baseline crates/inumaki-eval/baselines/offline.toml

  models:
    # x86 kernels differ from the Apple Silicon reference (see docs/ci.md), so
    # only the curated safety suite is enforced here (spec §13.1: other
    # architectures run the safety suite against the same absolute targets);
    # the corpus baselines are informational on this runner.
    runs-on: ubuntu-latest
    env:
      INUMAKI_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('models/manifest.toml') }}
      - run: cargo run --release -q -p inumaki-cli -- models pull
      - run: cargo run --release -q -p inumaki-cli -- models pull kiji-pii  # optional, for tests/kiji.rs
      - run: cargo run --release -q -p inumaki-cli -- models verify
      # The quantized kiji model's output depends on the x86 CPU's int8 kernels
      # (it found no names on one hosted runner and passed on another), so its
      # test is informational here and gated on the reference runner.
      - run: cargo test --release -p inumaki-models --features models-tests -- --skip kiji_finds_first_and_last_names
      - name: kiji model test (informational on x86)
        continue-on-error: true
        run: cargo test --release -p inumaki-models --features models-tests --test kiji
      - run: cargo test --release -p inumakid --features models-tests
      - name: curated safety suite (support-email)
        run: >
          cargo run --release -q -p inumaki-cli -- eval --profile support-email
          --cases-only --targets crates/inumaki-eval/targets/safety.toml
      - name: curated safety suite (strict)
        run: >
          cargo run --release -q -p inumaki-cli -- eval --profile strict
          --cases-only --targets crates/inumaki-eval/targets/safety.toml
      - name: corpus eval (informational on x86)
        continue-on-error: true
        run: cargo run --release -q -p inumaki-cli -- eval --profile support-email
      - run: cargo run --release -q -p inumaki-cli -- bench --profile support-email

  reference:
    # The self-hosted Apple Silicon reference runner, the machine the committed
    # baselines were measured on (spec §13.1); setup: docs/ci.md. It runs only
    # for pushes to main and only when the repository variable
    # REFERENCE_RUNNER is "true": never for pull requests, because on a public
    # repository that would run a fork's code on the maintainer's machine, and
    # not at all while no runner is registered, so runs do not queue forever.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.REFERENCE_RUNNER == 'true'
    runs-on: [self-hosted, macOS, ARM64, inumaki-reference]
    concurrency:
      group: inumaki-reference-runner
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: models directory
        run: |
          mkdir -p "$HOME/inumaki-ci/models"
          echo "INUMAKI_MODELS_DIR=$HOME/inumaki-ci/models" >> "$GITHUB_ENV"
      - run: cargo run --release -q -p inumaki-cli -- models pull
      - run: cargo run --release -q -p inumaki-cli -- models pull kiji-pii  # optional, for tests/kiji.rs
      - run: cargo run --release -q -p inumaki-cli -- models verify
      - run: cargo test --workspace
      - run: cargo test --release -p inumaki-models --features models-tests
      - run: cargo test --release -p inumakid --features models-tests
      - name: baseline gates (tuning corpus)
        run: |
          set -e
          for p in support-email strict thorough offline; do
            cargo run --release -q -p inumaki-cli -- eval --profile "$p" \
              --baseline "crates/inumaki-eval/baselines/$p.toml"
          done
      - name: baseline gates (held-out corpus)
        run: |
          set -e
          for p in support-email strict; do
            cargo run --release -q -p inumaki-cli -- eval --profile "$p" --held-out \
              --baseline "crates/inumaki-eval/baselines/held-out-$p.toml"
          done
      - name: curated safety suite
        run: |
          set -e
          for p in support-email strict; do
            cargo run --release -q -p inumaki-cli -- eval --profile "$p" --cases-only \
              --targets crates/inumaki-eval/targets/safety.toml
          done
      - name: M4 targets (spec §13.1)
        # informational until every gate in docs/quality/2026-09-25-matrix.md
        # passes; plan 4 removes continue-on-error when it qualifies M4.
        continue-on-error: true
        run: |
          set -e
          for p in support-email strict; do
            cargo run --release -q -p inumaki-cli -- eval --profile "$p" \
              --targets crates/inumaki-eval/targets/m4.toml
            cargo run --release -q -p inumaki-cli -- eval --profile "$p" --held-out \
              --targets crates/inumaki-eval/targets/m4.toml
          done
      - name: bench
        run: cargo run --release -q -p inumaki-cli -- bench --profile support-email
      - name: bench via daemon
        run: |
          cargo build --release -p inumaki-cli
          ./target/release/inumaki daemon --data-dir "$RUNNER_TEMP/inumaki-data" --socket "$RUNNER_TEMP/inumakid-ci.sock" &
          DAEMON=$!
          for i in $(seq 1 60); do [ -S "$RUNNER_TEMP/inumakid-ci.sock" ] && break; sleep 1; done
          ./target/release/inumaki --socket "$RUNNER_TEMP/inumakid-ci.sock" bench --via-daemon
          kill -TERM "$DAEMON"
          wait "$DAEMON" || true
